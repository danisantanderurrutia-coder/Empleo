name: "Daily Job Alerts (PAUSADO / PAUSED)"

on:
  # DESACTIVADO PREVENTIVAMENTE: Cron matutino pausado para evitar envíos con enlaces obsoletos o alucinados
  # schedule:
  #   - cron: '15 7 * * *'
  workflow_dispatch: # Permite disparo manual controlado desde la pestaña Actions de GitHub solo si se desea probar

permissions:
  contents: read

jobs:
  run-alerts:
    name: Execute Daily Job Digest (Manual Only)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Check if Alerts are Explicitly Enabled
        id: check-enabled
        run: |
          if [ "${{ vars.ENABLE_JOB_ALERTS }}" != "true" ]; then
            echo "::notice ::Las alertas automáticas por correo están en PAUSA PREVENTIVA. Cancelando envío para evitar alucinaciones."
            echo "enabled=false" >> $GITHUB_OUTPUT
          else
            echo "enabled=true" >> $GITHUB_OUTPUT
          fi

      - name: Run Job Alert Pipeline
        if: steps.check-enabled.outputs.enabled == 'true'
        env:
          ENABLE_JOB_ALERTS: ${{ vars.ENABLE_JOB_ALERTS || 'false' }}
          ALERT_RECIPIENT_EMAIL: ${{ secrets.ALERT_RECIPIENT_EMAIL || 'danisantander.urrutia@gmail.com' }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          SMTP_HOST: ${{ secrets.SMTP_HOST || 'smtp.gmail.com' }}
          SMTP_PORT: ${{ secrets.SMTP_PORT || '587' }}
          SMTP_USER: ${{ secrets.SMTP_USER || 'danisantander.urrutia@gmail.com' }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
        run: |
          python scripts/daily_job_alerts.py

      - name: Upload HTML Digest Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: latest-job-digest
          path: scripts/latest_job_digest.html
          retention-days: 7
