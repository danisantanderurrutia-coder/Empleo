<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="ph-prism-left" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="ph-prism-right" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <linearGradient id="ph-core-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <filter id="ph-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="9" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Base Squircle -->
  <rect width="512" height="512" rx="116" fill="#06090e"/>
  <rect x="12" y="12" width="488" height="488" rx="104" fill="none" stroke="url(#ph-core-grad)" stroke-opacity="0.5" stroke-width="3"/>
  <rect x="22" y="22" width="468" height="468" rx="94" fill="none" stroke="#10b981" stroke-opacity="0.15" stroke-width="1.5"/>

  <!-- Dual Concentric Horizon Calibration Rings -->
  <circle cx="256" cy="256" r="205" fill="none" stroke="#0ea5e9" stroke-width="1.5" stroke-dasharray="6 12" opacity="0.25"/>
  <circle cx="256" cy="256" r="165" fill="none" stroke="#10b981" stroke-width="1" opacity="0.2"/>
  <circle cx="256" cy="256" r="95" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="2 6" opacity="0.4"/>

  <!-- Symmetrical Faceted Monogram 'H' with Center Diamond Lock -->
  <!-- Left Beveled Prism Leg -->
  <path d="M 142 136 L 212 136 L 212 216 L 244 256 L 212 296 L 212 376 L 142 376 Z" 
        fill="url(#ph-prism-left)" filter="url(#ph-glow)" opacity="0.3"/>
  <path d="M 142 136 L 212 136 L 212 216 L 244 256 L 212 296 L 212 376 L 142 376 Z" 
        fill="url(#ph-prism-left)"/>
  <path d="M 152 148 L 200 148 L 200 210 L 228 256 L 200 302 L 200 364 L 152 364 Z" 
        fill="#ffffff" opacity="0.9"/>

  <!-- Right Beveled Prism Leg -->
  <path d="M 370 136 L 300 136 L 300 216 L 268 256 L 300 296 L 300 376 L 370 376 Z" 
        fill="url(#ph-prism-right)" filter="url(#ph-glow)" opacity="0.3"/>
  <path d="M 370 136 L 300 136 L 300 216 L 268 256 L 300 296 L 300 376 L 370 376 Z" 
        fill="url(#ph-prism-right)"/>
  <path d="M 360 148 L 312 148 L 312 210 L 284 256 L 312 302 L 312 364 L 360 364 Z" 
        fill="#ffffff" opacity="0.9"/>

  <!-- The Double Negative-Space Diamond Core (Optical Gate) -->
  <polygon points="256,186 312,256 256,326 200,256" fill="#06090e" stroke="url(#ph-core-grad)" stroke-width="4"/>
  <polygon points="256,212 292,256 256,300 220,256" fill="url(#ph-core-grad)" opacity="0.3"/>

  <!-- Precision Reticle Crosshair Ticks -->
  <line x1="256" y1="162" x2="256" y2="182" stroke="#10b981" stroke-width="3.5" stroke-linecap="round"/>
  <line x1="256" y1="330" x2="256" y2="350" stroke="#10b981" stroke-width="3.5" stroke-linecap="round"/>
  <line x1="176" y1="256" x2="196" y2="256" stroke="#38bdf8" stroke-width="3.5" stroke-linecap="round"/>
  <line x1="316" y1="256" x2="336" y2="256" stroke="#38bdf8" stroke-width="3.5" stroke-linecap="round"/>

  <!-- Central Emerald Pulse Beacon -->
  <circle cx="256" cy="256" r="9" fill="#10b981" filter="url(#ph-glow)"/>
  <circle cx="256" cy="256" r="3.5" fill="#ffffff"/>

  <!-- Cardinal Orbit Calibration Markers -->
  <circle cx="256" cy="51" r="5" fill="#38bdf8"/>
  <circle cx="461" cy="256" r="5" fill="#10b981"/>
  <circle cx="256" cy="461" r="5" fill="#38bdf8"/>
  <circle cx="51" cy="256" r="5" fill="#10b981"/>
</svg>
