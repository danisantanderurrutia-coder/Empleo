<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <filter id="emGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <linearGradient id="emCyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <linearGradient id="emBevel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>

  <!-- Outer Beveled Squircle Badge -->
  <rect width="512" height="512" rx="112" fill="#090b0e"/>
  <rect x="8" y="8" width="496" height="496" rx="104" fill="none" stroke="url(#emBevel)" stroke-width="6"/>
  <rect x="14" y="14" width="484" height="484" rx="98" fill="none" stroke="#06b6d4" stroke-opacity="0.3" stroke-width="2"/>

  <!-- Compass / Azimuth Ring -->
  <circle cx="256" cy="256" r="195" fill="none" stroke="#38bdf8" stroke-width="2.5" opacity="0.4"/>
  <circle cx="256" cy="256" r="185" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-dasharray="2 6" opacity="0.35"/>

  <!-- Cardinal Points: N, E, S, W -->
  <text x="256" y="82" fill="#38bdf8" font-family="system-ui, sans-serif" font-weight="900" font-size="20" text-anchor="middle">N</text>
  <text x="438" y="263" fill="#38bdf8" font-family="system-ui, sans-serif" font-weight="900" font-size="20" text-anchor="middle">E</text>
  <text x="256" y="445" fill="#38bdf8" font-family="system-ui, sans-serif" font-weight="900" font-size="20" text-anchor="middle">S</text>
  <text x="74" y="263" fill="#38bdf8" font-family="system-ui, sans-serif" font-weight="900" font-size="20" text-anchor="middle">W</text>

  <!-- Concentric Radar Rings -->
  <circle cx="256" cy="256" r="150" fill="none" stroke="#06b6d4" stroke-width="3" opacity="0.45"/>
  <circle cx="256" cy="256" r="115" fill="none" stroke="#06b6d4" stroke-width="2.5" stroke-dasharray="6 6" opacity="0.5"/>
  <circle cx="256" cy="256" r="75" fill="none" stroke="#06b6d4" stroke-width="2.5" opacity="0.6"/>

  <!-- Reticle Crosshair Axes -->
  <line x1="256" y1="96" x2="256" y2="416" stroke="#06b6d4" stroke-width="2" stroke-dasharray="6 4" opacity="0.4"/>
  <line x1="96" y1="256" x2="416" y2="256" stroke="#06b6d4" stroke-width="2" stroke-dasharray="6 4" opacity="0.4"/>

  <!-- Radar Sweep Cone -->
  <path d="M 256,256 L 362,150 A 150,150 0 0,0 256,106 Z" fill="url(#emCyanGrad)" fill-opacity="0.28"/>
  <line x1="256" y1="256" x2="362" y2="150" stroke="url(#emCyanGrad)" stroke-width="6" stroke-linecap="round" filter="url(#emGlow)"/>

  <!-- Amber Target Lock Dot -->
  <circle cx="340" cy="188" r="8" fill="#f59e0b" filter="url(#emGlow)"/>
  <circle cx="340" cy="188" r="18" fill="none" stroke="#f59e0b" stroke-width="3" stroke-dasharray="4 3"/>

  <!-- Tactical 'EM' Monogram at Center -->
  <!-- E Glyph -->
  <path d="M 218,206 L 175,206 L 175,306 L 218,306 M 175,256 L 210,256" 
        fill="none" stroke="#38bdf8" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" filter="url(#emGlow)"/>
  <path d="M 218,206 L 175,206 L 175,306 L 218,306 M 175,256 L 210,256" 
        fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- M Glyph -->
  <path d="M 238,306 L 238,206 L 278,266 L 318,206 L 318,306" 
        fill="none" stroke="#38bdf8" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" filter="url(#emGlow)"/>
  <path d="M 238,306 L 238,206 L 278,266 L 318,206 L 318,306" 
        fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
