<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="fav-left" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="fav-right" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <linearGradient id="fav-core" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
  </defs>

  <!-- Dark Background Badge -->
  <rect width="512" height="512" rx="116" fill="#06090e"/>
  <rect x="12" y="12" width="488" height="488" rx="104" fill="none" stroke="url(#fav-core)" stroke-opacity="0.6" stroke-width="6"/>

  <!-- Orbital Ring -->
  <circle cx="256" cy="256" r="200" fill="none" stroke="#0ea5e9" stroke-width="3" stroke-dasharray="12 12" opacity="0.4"/>
  <circle cx="256" cy="256" r="150" fill="none" stroke="#10b981" stroke-width="2" opacity="0.3"/>

  <!-- High-Contrast Monogram H (Favicon Calibrated) -->
  <!-- Left Leg -->
  <path d="M 132 120 L 216 120 L 216 210 L 250 256 L 216 302 L 216 392 L 132 392 Z" fill="url(#fav-left)"/>
  <path d="M 144 136 L 202 136 L 202 204 L 232 256 L 202 308 L 202 376 L 144 376 Z" fill="#ffffff"/>

  <!-- Right Leg -->
  <path d="M 380 120 L 296 120 L 296 210 L 262 256 L 296 302 L 296 392 L 380 392 Z" fill="url(#fav-right)"/>
  <path d="M 368 136 L 310 136 L 310 204 L 280 256 L 310 308 L 310 376 L 368 376 Z" fill="#ffffff"/>

  <!-- Central Diamond Prism Core -->
  <polygon points="256,176 320,256 256,336 192,256" fill="#06090e" stroke="url(#fav-core)" stroke-width="8"/>
  <polygon points="256,206 298,256 256,306 214,256" fill="url(#fav-core)" opacity="0.4"/>

  <!-- Reticle Ticks -->
  <line x1="256" y1="140" x2="256" y2="170" stroke="#10b981" stroke-width="6" stroke-linecap="round"/>
  <line x1="256" y1="342" x2="256" y2="372" stroke="#10b981" stroke-width="6" stroke-linecap="round"/>
  <line x1="156" y1="256" x2="186" y2="256" stroke="#38bdf8" stroke-width="6" stroke-linecap="round"/>
  <line x1="326" y1="256" x2="356" y2="256" stroke="#38bdf8" stroke-width="6" stroke-linecap="round"/>

  <!-- Emerald Target Lock Center Beacon -->
  <circle cx="256" cy="256" r="14" fill="#10b981"/>
  <circle cx="256" cy="256" r="6" fill="#ffffff"/>
</svg>
