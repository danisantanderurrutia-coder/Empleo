<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <filter id="emGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <linearGradient id="emCyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <linearGradient id="emBevel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.8"/>
    </linearGradient>
  </defs>

  <!-- Outer Beveled Squircle Badge -->
  <rect width="512" height="512" rx="112" fill="#060910"/>
  <rect x="10" y="10" width="492" height="492" rx="102" fill="none" stroke="url(#emBevel)" stroke-width="6"/>
  <rect x="18" y="18" width="476" height="476" rx="94" fill="none" stroke="#0ea5e9" stroke-opacity="0.3" stroke-width="2"/>

  <!-- Subtle Tactical Radar Grid Behind -->
  <circle cx="256" cy="256" r="210" fill="none" stroke="#0284c7" stroke-width="1.5" stroke-dasharray="4 8" opacity="0.25"/>
  <circle cx="256" cy="256" r="160" fill="none" stroke="#06b6d4" stroke-width="1.5" opacity="0.2"/>
  <line x1="256" y1="36" x2="256" y2="476" stroke="#0284c7" stroke-width="1.5" stroke-dasharray="6 6" opacity="0.18"/>
  <line x1="36" y1="256" x2="476" y2="256" stroke="#0284c7" stroke-width="1.5" stroke-dasharray="6 6" opacity="0.18"/>

  <!-- Radar Sweep Subtle Glow -->
  <path d="M 256,256 L 416,136 A 200,200 0 0,0 256,56 Z" fill="url(#emCyanGrad)" fill-opacity="0.16"/>

  <!-- Zoomed & Bold High-Contrast 'EM' Monogram -->
  <!-- Glow Shadow Layer -->
  <path d="M 226,124 L 84,124 L 84,388 L 226,388 M 84,256 L 208,256" 
        fill="none" stroke="url(#emCyanGrad)" stroke-width="32" stroke-linecap="round" stroke-linejoin="round" filter="url(#emGlow)"/>
  <path d="M 256,388 L 256,124 L 342,274 L 428,124 L 428,388" 
        fill="none" stroke="url(#emCyanGrad)" stroke-width="32" stroke-linecap="round" stroke-linejoin="round" filter="url(#emGlow)"/>

  <!-- Core White High-Fidelity Stroke -->
  <path d="M 226,124 L 84,124 L 84,388 L 226,388 M 84,256 L 208,256" 
        fill="none" stroke="#ffffff" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 256,388 L 256,124 L 342,274 L 428,124 L 428,388" 
        fill="none" stroke="#ffffff" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Amber Tactical Lock Reticle Corner Accent -->
  <circle cx="438" cy="74" r="7" fill="#f59e0b" filter="url(#emGlow)"/>
  <circle cx="438" cy="74" r="14" fill="none" stroke="#f59e0b" stroke-width="2.5" stroke-dasharray="3 3"/>
</svg>
